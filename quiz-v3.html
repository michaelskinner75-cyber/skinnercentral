<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Skinners Bar Quiz</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#12081d;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:780px;margin:auto;padding:10px}.top{display:flex;align-items:center;gap:10px}.top h1{flex:1;font-size:1.35rem}.home,button,input,select{min-height:44px;border:0;border-radius:13px;padding:9px 12px;font:inherit}.home{background:#ffffff14;color:#fff;text-decoration:none;display:grid;place-items:center}.panel{margin-top:10px;padding:14px;background:#ffffff0d;border:1px solid #ffffff1c;border-radius:18px}.hidden{display:none!important}.setup{display:grid;gap:10px}input,select{width:100%;background:#0b0510;color:#fff;border:1px solid #ffffff22}.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}.level{background:#ffffff10;color:#fff;border:1px solid #ffffff22;font-weight:900}.level.on{background:#ffd65a;color:#321500}.categories{display:grid;grid-template-columns:1fr 1fr;gap:7px}.cat{display:flex;gap:8px;align-items:center;padding:9px;border-radius:12px;background:#ffffff0b;border:1px solid #ffffff18}.cat.on{border-color:#ffd65a;background:#ffd65a16}.cat input{width:18px;height:18px;min-height:0}.cat small{display:block;color:#c9bdd2}.buttons,.answers{display:grid;grid-template-columns:1fr 1fr;gap:8px}.primary{background:#ffd65a;color:#321500;font-weight:900}.secondary{background:#ffffff14;color:#fff;font-weight:850}.teams{background:#7657e8;color:#fff;font-weight:900}.note{margin:0;color:#ffd65a;font-weight:800}.row{display:flex;justify-content:space-between;gap:10px;padding:9px;border-radius:11px;background:#0004;margin-top:6px}.question{font-size:clamp(1.15rem,5vw,1.8rem);font-weight:900;margin:13px 0}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#7657e833;color:#ded6ff;font-size:.75rem;font-weight:900}.answer{text-align:left;background:#ffffff12;color:#fff;border:1px solid #ffffff20;font-weight:850}.correct{background:#34c77d!important;color:#062313}.wrong{background:#cf3554!important}.team-turn{text-align:center;padding:9px;border-radius:12px;background:#7657e833;border:1px solid #907ce6;font-weight:900;margin:9px 0}.room{font-size:2.3rem;color:#ffd65a;text-align:center;font-weight:1000;letter-spacing:.15em}.team-fields{display:grid;gap:7px}@media(max-width:540px){.categories,.buttons,.answers{grid-template-columns:1fr}.app{padding:7px}.panel{padding:11px}}
</style>
</head>
<body><main class="app">
<header class="top"><div>🧠</div><h1>Skinners Bar Quiz</h1><a class="home" href="index.html">🏠 Home</a></header>
<section id="setup" class="panel setup">
<input id="name" maxlength="18" placeholder="Your name">
<div><strong>Question level</strong><div class="choice"><button id="kids" class="level on">🧒 Kids</button><button id="adults" class="level">🧑 Adults</button></div></div>
<label>Number of questions<select id="count"><option>5</option><option selected>10</option><option>15</option><option>20</option><option>25</option><option>30</option></select></label>
<div><strong>Choose up to 6 categories</strong><p id="pickNote" class="note">1 of 6 selected</p></div>
<div id="cats" class="categories"></div>
<div class="buttons"><button id="single" class="primary">Single Player</button><button id="teams" class="teams">👥 Teams Quiz</button><button id="create" class="secondary">Create Multiplayer</button><button id="showJoin" class="secondary">Join Multiplayer</button></div>
<div id="teamBox" class="hidden"><select id="teamCount"><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select><div id="teamFields" class="team-fields"></div><button id="startTeams" class="primary" style="width:100%;margin-top:8px">Start Teams Quiz</button></div>
<div id="joinBox" class="hidden"><input id="code" maxlength="4" inputmode="numeric" placeholder="Room code"><button id="join" class="primary" style="width:100%;margin-top:8px">Join Room</button></div>
<p id="status" class="note"></p>
</section>
<section id="lobby" class="panel hidden"><h2>Room code</h2><div id="room" class="room"></div><div id="players"></div><button id="startMulti" class="primary hidden" style="width:100%;margin-top:10px">Start Quiz</button><p id="waiting">Waiting for the creator to start.</p></section>
<section id="game" class="panel hidden"><div class="row"><span id="progress"></span><b id="score">0</b></div><div id="teamTurn" class="team-turn hidden"></div><div id="badge" class="badge"></div><div id="question" class="question"></div><div id="answers" class="answers"></div><button id="next" class="primary hidden" style="width:100%;margin-top:10px">Next Question</button><div id="scores"></div></section>
<section id="result" class="panel hidden"><h2>Quiz Complete</h2><div id="final"></div><button class="primary" style="width:100%;margin-top:10px" onclick="location.reload()">Play Again</button></section>
</main>
<script>
const DB='https://skinners-bar-bingo-default-rtdb.europe-west1.firebasedatabase.app/quizRoomsV3';
const id=localStorage.quizPlayerId||crypto.randomUUID();localStorage.quizPlayerId=id;
const $=x=>document.getElementById(x),shuffle=a=>[...a].sort(()=>Math.random()-.5);
let qs=[],index=0,score=0,locked=false,room='',host=false,name='Player',poll=null,mode='single',teams=[],activeTeam=0,level='kids';
const info={movies:['Movies & TV','🎬','Film and television'],price:['The Price Is Right','💷','Guess the closest price'],lines:['Guess the Movie Line','🎭','Name the film'],disney:['Disney','🏰','Disney films and characters'],lyrics:['Finish the Lyrics','🎵','Complete the missing words'],general:['General Knowledge','🌍','A broad mixture'],pub:['Pub Quiz','🍺','Classic pub questions']};
const bank={
kids:{
movies:[['Which film has a snowman called Olaf?',['Frozen','Moana','Cars','Brave'],0],['Who is the ogre in Shrek?',['Shrek','Donkey','Farquaad','Puss'],0],['Which hero is also Peter Parker?',['Spider-Man','Batman','Superman','Hulk'],0],['What colour is SpongeBob?',['Yellow','Blue','Green','Red'],0]],
price:[['Closest price for a chocolate bar?',['£1','£5','£10','£20'],0],['Closest price for a cinema ticket?',['£10','£2','£30','£60'],0],['Closest price for a football?',['£15','£1','£80','£200'],0],['Closest price for a family pizza?',['£15','£2','£50','£100'],0]],
lines:[['“To infinity and beyond!”',['Toy Story','Cars','Frozen','Up'],0],['“Just keep swimming.”',['Finding Nemo','Shrek','Moana','Frozen'],0],['“Hakuna Matata.”',['The Lion King','Aladdin','Encanto','Bambi'],0],['“Ohana means family.”',['Lilo & Stitch','Frozen','Cars','Toy Story'],0]],
disney:[['What is Simba’s father called?',['Mufasa','Scar','Timon','Rafiki'],0],['Who leaves a glass slipper?',['Cinderella','Ariel','Belle','Tiana'],0],['What kind of fish is Nemo?',['Clownfish','Goldfish','Tuna','Shark'],0],['What is Elsa’s sister called?',['Anna','Moana','Merida','Mirabel'],0]],
lyrics:[['Finish: “Twinkle, twinkle, little…”',['star','moon','sky','sun'],0],['Finish: “Happy birthday to…”',['you','me','us','them'],0],['Finish: “Old MacDonald had a…”',['farm','car','shop','boat'],0],['Finish: “Row, row, row your…”',['boat','car','bike','train'],0]],
general:[['How many sides has a triangle?',['3','4','5','6'],0],['Which planet is known as the Red Planet?',['Mars','Venus','Earth','Jupiter'],0],['What is H2O?',['Water','Salt','Air','Fire'],0],['How many minutes are in one hour?',['60','30','90','100'],0]],
pub:[['How many players start on a football team?',['11','9','12','15'],0],['Which country invented pizza?',['Italy','France','Spain','Greece'],0],['What colour is the middle traffic light?',['Amber','Green','Red','Blue'],0],['Which ocean is between Europe and America?',['Atlantic','Pacific','Indian','Arctic'],0]]},
adults:{
movies:[['Who directed Jaws?',['Steven Spielberg','James Cameron','Ridley Scott','George Lucas'],0],['Which TV series features Walter White?',['Breaking Bad','The Wire','Lost','Dexter'],0],['Who played Jack in Titanic?',['Leonardo DiCaprio','Brad Pitt','Tom Cruise','Matt Damon'],0],['Which series includes the Iron Throne?',['Game of Thrones','The Witcher','Vikings','The Crown'],0]],
price:[['Closest price for a mid-range smartphone?',['£500','£80','£1,800','£3,000'],0],['Closest price for a new games console?',['£450','£100','£900','£1,500'],0],['Closest price for a family meal out?',['£80','£15','£250','£500'],0],['Closest price for a litre of petrol?',['£1.50','£0.50','£3.50','£6.00'],0]],
lines:[['“I’ll be back.”',['The Terminator','Rocky','Jaws','Alien'],0],['“Why so serious?”',['The Dark Knight','Joker','Batman Begins','The Batman'],0],['“You can’t handle the truth!”',['A Few Good Men','Top Gun','Heat','The Departed'],0],['“I see dead people.”',['The Sixth Sense','Ghost','Poltergeist','The Others'],0]],
disney:[['Which year was The Lion King first released?',['1994','1989','2001','1998'],0],['Who composed much of The Lion King soundtrack?',['Hans Zimmer','John Williams','Alan Menken','Danny Elfman'],0],['Which Disney film features the song “Surface Pressure”?',['Encanto','Frozen','Moana','Coco'],0],['What is the name of Ariel’s father?',['King Triton','King Stefan','King Fergus','Mufasa'],0]],
lyrics:[['Finish: “Is this the real life? Is this…”',['just fantasy','a mystery','my destiny','a dream'],0],['Finish: “Don’t stop believing, hold on to…”',['that feeling','the night','your dreams','the music'],0],['Finish: “Hit me baby one more…”',['time','night','day','chance'],0],['Finish: “We will, we will…”',['rock you','find you','love you','beat you'],0]],
general:[['What is the capital of Australia?',['Canberra','Sydney','Melbourne','Perth'],0],['What is the smallest prime number?',['2','1','3','0'],0],['Which element has the symbol Fe?',['Iron','Fluorine','Francium','Fermium'],0],['Who wrote 1984?',['George Orwell','Aldous Huxley','J.R.R. Tolkien','H.G. Wells'],0]],
pub:[['Which spirit is used in a mojito?',['Rum','Gin','Vodka','Whisky'],0],['What is the capital of Canada?',['Ottawa','Toronto','Vancouver','Montreal'],0],['Which artist painted Guernica?',['Pablo Picasso','Salvador Dalí','Claude Monet','Vincent van Gogh'],0],['How many pockets are on a standard snooker table?',['6','4','8','10'],0]]}};
let selected=new Set(['general']);
function show(v){['setup','lobby','game','result'].forEach(x=>$(x).classList.toggle('hidden',x!==v))}
function setLevel(v){level=v;$('kids').classList.toggle('on',v==='kids');$('adults').classList.toggle('on',v==='adults')}
function renderCats(){$('cats').innerHTML=Object.entries(info).map(([k,v])=>`<label class="cat ${selected.has(k)?'on':''}"><input type="checkbox" value="${k}" ${selected.has(k)?'checked':''}><span>${v[1]}</span><span><strong>${v[0]}</strong><small>${v[2]}</small></span></label>`).join('');$('pickNote').textContent=`${selected.size} of 6 selected`;document.querySelectorAll('.cat input').forEach(x=>x.onchange=()=>{if(x.checked&&selected.size>=6){x.checked=false;$('status').textContent='Maximum 6 categories.';return}x.checked?selected.add(x.value):selected.delete(x.value);if(!selected.size)selected.add('general');renderCats()})}
function makeQuestions(n,keys=[...selected],chosenLevel=level){let pool=[];keys.forEach(k=>(bank[chosenLevel][k]||[]).forEach(q=>pool.push({q:q[0],answers:q[1],correct:q[2],category:info[k][0]})));while(pool.length<n)pool=pool.concat(pool);return shuffle(pool).slice(0,n).map(q=>{const right=q.answers[q.correct],answers=shuffle(q.answers);return{...q,answers,correct:answers.indexOf(right)}})}
function renderScores(players={},target='scores'){const html=Object.values(players).sort((a,b)=>(b.score||0)-(a.score||0)).map((p,i)=>`<div class="row"><span>${i+1}. ${p.name}</span><b>${p.score||0}</b></div>`).join('');$(target).innerHTML=html}
function renderTeamScores(target='scores'){renderScores(Object.fromEntries(teams.map((t,i)=>[i,t])),target)}
function render(){locked=false;$('next').classList.add('hidden');const q=qs[index];$('progress').textContent=`Question ${index+1} of ${qs.length}`;$('badge').textContent=`${q.category} · ${level==='kids'?'Kids':'Adults'}`;$('question').textContent=q.q;if(mode==='teams'){$('teamTurn').classList.remove('hidden');$('teamTurn').textContent=`${teams[activeTeam].name}'s turn`;$('score').textContent=`Score: ${teams[activeTeam].score}`;renderTeamScores()}else{$('teamTurn').classList.add('hidden');$('score').textContent=`Score: ${score}`}$('answers').innerHTML='';q.answers.forEach((a,n)=>{const b=document.createElement('button');b.className='answer';b.textContent=a;b.onclick=()=>answer(n,b);$('answers').appendChild(b)})}
async function answer(n,b){if(locked)return;locked=true;const right=qs[index].correct;[...$('answers').children].forEach((x,j)=>{x.disabled=true;if(j===right)x.classList.add('correct')});if(n===right){if(mode==='teams')teams[activeTeam].score++;else score++}else b.classList.add('wrong');if(mode==='teams')renderTeamScores();else $('score').textContent=`Score: ${score}`;if(room)await patch(`players/${id}`,{score,answered:index});if(!room||host)$('next').classList.remove('hidden')}
async function api(url,opt){const r=await fetch(url,opt);if(!r.ok)throw Error('Network error');return r.json()}
async function readRoom(){return api(`${DB}/${room}.json`)}async function patch(path,data){return api(`${DB}/${room}/${path}.json`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)})}
function startLocal(m){mode=m;qs=makeQuestions(+$('count').value);index=score=0;show('game');render()}
function buildTeams(){$('teamFields').innerHTML=Array.from({length:+$('teamCount').value},(_,i)=>`<input class="team-name" maxlength="18" value="Team ${i+1}">`).join('')}
async function createRoom(){try{mode='multi';name=$('name').value.trim()||'Host';room=String(Math.floor(1000+Math.random()*9000));host=true;await api(`${DB}/${room}.json`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({hostId:id,phase:'lobby',count:+$('count').value,categories:[...selected],level,index:0,players:{[id]:{name,score:0,answered:-1}}})});show('lobby');listen()}catch(e){$('status').textContent='Could not create room.'}}
async function joinRoom(){try{mode='multi';name=$('name').value.trim()||'Player';room=$('code').value.trim();const r=await readRoom();if(!r)throw Error();host=r.hostId===id;level=r.level||'kids';await patch(`players/${id}`,{name,score:0,answered:-1});show('lobby');listen()}catch(e){$('status').textContent='Room not found.'}}
function listen(){clearInterval(poll);$('room').textContent=room;const read=async()=>{if(document.hidden)return;const r=await readRoom();if(!r)return;renderScores(r.players,'players');$('startMulti').classList.toggle('hidden',!host);$('waiting').classList.toggle('hidden',host);if(r.phase==='playing'){qs=r.questions||[];level=r.level||level;const ni=r.index||0;score=r.players?.[id]?.score||0;if(index!==ni||$('game').classList.contains('hidden')){index=ni;show('game');render()}}if(r.phase==='finished'){show('result');renderScores(r.players,'final')}};read();poll=setInterval(read,3000)}
async function startMulti(){const r=await readRoom();const q=makeQuestions(r.count||10,r.categories||['general'],r.level||'kids');await patch('',{phase:'playing',questions:q,index:0})}
async function next(){if(mode==='teams'){index++;if(index<qs.length){activeTeam=(activeTeam+1)%teams.length;render()}else{show('result');renderTeamScores('final')}return}if(!room){index++;if(index<qs.length)render();else{show('result');$('final').innerHTML=`<div class="row"><span>${name||'Player'}</span><b>${score}/${qs.length}</b></div>`}return}const ni=index+1;if(ni>=qs.length)await patch('',{phase:'finished'});else await patch('',{index:ni})}
$('kids').onclick=()=>setLevel('kids');$('adults').onclick=()=>setLevel('adults');$('single').onclick=()=>{name=$('name').value.trim()||'Player';startLocal('single')};$('teams').onclick=()=>{$('teamBox').classList.toggle('hidden');$('joinBox').classList.add('hidden');buildTeams()};$('teamCount').onchange=buildTeams;$('startTeams').onclick=()=>{teams=[...document.querySelectorAll('.team-name')].map((x,i)=>({name:x.value.trim()||`Team ${i+1}`,score:0}));activeTeam=0;startLocal('teams')};$('create').onclick=createRoom;$('showJoin').onclick=()=>{$('joinBox').classList.toggle('hidden');$('teamBox').classList.add('hidden')};$('join').onclick=joinRoom;$('startMulti').onclick=startMulti;$('next').onclick=next;renderCats();buildTeams();
</script>
</body></html>
