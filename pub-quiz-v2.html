<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Skinners Bar Quiz</title><style>*{box-sizing:border-box}body{margin:0;background:#12081d;color:#fff;font-family:system-ui}.app{max-width:850px;margin:auto;padding:14px}.top{display:flex;align-items:center;gap:10px}.top h1{flex:1;font-size:clamp(1.25rem,5vw,2rem)}.home,button,input,select{border:0;border-radius:14px;min-height:46px;padding:10px 13px;font:inherit}.home{color:#fff;background:#ffffff14;text-decoration:none}.panel{margin-top:12px;padding:16px;background:#ffffff0e;border:1px solid #ffffff1c;border-radius:20px}.hidden{display:none!important}.setup{display:grid;gap:10px}.setup input,.setup select,.team-input{width:100%;background:#0d0613;color:#fff;border:1px solid #ffffff22}.buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.primary{background:#ffd65a;color:#321500;font-weight:900}.secondary{background:#ffffff14;color:#fff;font-weight:900}.teams-btn{background:#7b5cff;color:#fff;font-weight:900}.categories{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.category{display:flex;align-items:center;gap:9px;background:#ffffff0b;border:1px solid #ffffff1e;border-radius:14px;padding:10px;cursor:pointer}.category input{width:20px;height:20px;min-height:0}.category.selected{border-color:#ffd65a;background:#ffd65a18}.category strong{display:block}.category small{color:#c8bcd2}.selection-note{margin:0;color:#ffd65a;font-weight:800}.room{font-size:2.5rem;color:#ffd65a;text-align:center;font-weight:1000;letter-spacing:.12em}.question-type{display:inline-block;padding:6px 10px;border-radius:999px;background:#7b5cff33;color:#ded6ff;font-size:.78rem;font-weight:900}.question{font-size:clamp(1.2rem,5vw,2rem);font-weight:900;margin:14px 0}.quiz-image{display:block;max-width:min(260px,70vw);max-height:150px;margin:10px auto 16px;background:#fff;border-radius:18px;padding:14px;object-fit:contain}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.answer{text-align:left;background:#ffffff12;color:#fff;border:1px solid #ffffff20;font-weight:900}.correct{background:#34c77d!important;color:#062313}.wrong{background:#cf3554!important}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#0004;padding:9px;border-radius:10px;margin-top:7px}.active-team{outline:2px solid #ffd65a;background:#ffd65a18}.team-turn{text-align:center;padding:10px;border-radius:14px;background:#7b5cff33;border:1px solid #9c89ff;color:#e8e2ff;font-weight:900;margin:10px 0}.team-fields{display:grid;gap:8px;margin-top:8px}.team-note{color:#cdbfff;font-size:.85rem;margin:0}@media(max-width:560px){.buttons,.answers,.categories{grid-template-columns:1fr}.app{padding:8px}.panel{padding:12px}}</style></head><body><div class="app"><header class="top"><div>🧠</div><h1>Skinners Bar Quiz</h1><a class="home" href="index.html">🏠 Home</a></header><section id="setup" class="panel setup"><input id="name" placeholder="Your name" maxlength="18"><label>How many questions?<select id="count"><option>5</option><option selected>10</option><option>15</option><option>20</option><option>25</option><option>30</option></select></label><div><strong>Choose up to 6 categories</strong><p id="selectionNote" class="selection-note">1 of 6 selected</p></div><div id="categories" class="categories"></div><div class="buttons"><button id="single" class="primary">Single Player</button><button id="teams" class="teams-btn">👥 Teams Quiz</button><button id="create" class="secondary">Create Multiplayer</button><button id="showJoin" class="secondary">Join Multiplayer</button></div><div id="teamBox" class="hidden"><select id="teamCount"><option value="2">2 teams</option><option value="3">3 teams</option><option value="4">4 teams</option><option value="5">5 teams</option><option value="6">6 teams</option></select><div id="teamFields" class="team-fields"></div><p class="team-note">Teams take turns. Each correct answer earns one point.</p><button id="startTeams" class="primary" style="width:100%;margin-top:8px">Start Teams Quiz</button></div><div id="joinBox" class="hidden"><input id="code" maxlength="4" inputmode="numeric" placeholder="Room code"><button id="join" class="primary" style="width:100%;margin-top:8px">Join Room</button></div><p id="status"></p></section><section id="lobby" class="panel hidden"><h2>Room code</h2><div id="room" class="room"></div><div id="players"></div><button id="startMulti" class="primary hidden" style="width:100%;margin-top:12px">Start Quiz</button><p id="waiting">Waiting for the creator to start.</p></section><section id="game" class="panel hidden"><div class="row"><span id="progress"></span><b id="score">0</b></div><div id="teamTurn" class="team-turn hidden"></div><div id="questionType" class="question-type"></div><img id="quizImage" class="quiz-image hidden" alt="Quiz clue"><div id="question" class="question"></div><div id="answers" class="answers"></div><button id="next" class="primary hidden" style="width:100%;margin-top:12px">Next Question</button><div id="scores"></div></section><section id="result" class="panel hidden"><h2>Quiz Complete</h2><div id="final"></div><button class="primary" style="width:100%;margin-top:12px" onclick="location.reload()">Play Again</button></section></div><script>const DB='https://skinners-bar-bingo-default-rtdb.europe-west1.firebasedatabase.app/quizRooms',id=localStorage.quizPlayerId||crypto.randomUUID();localStorage.quizPlayerId=id;const $=x=>document.getElementById(x),shuffle=a=>[...a].sort(()=>Math.random()-.5);let qs=[],index=0,score=0,locked=false,room='',host=false,name='Player',timer=null,gameMode='single',teamList=[],activeTeam=0;const categories={logos:{label:'Logo Quiz',icon:'🏷️',desc:'Identify famous brands'},movies:{label:'Movies & TV',icon:'🎬',desc:'Film and television'},price:{label:'The Price Is Right',icon:'💷',desc:'Guess the closest price'},lines:{label:'Guess the Movie Line',icon:'🎭',desc:'Name the film'},disney:{label:'Disney',icon:'🏰',desc:'Disney films and characters'},lyrics:{label:'Finish the Lyrics',icon:'🎵',desc:'Complete the missing word'},general:{label:'General Knowledge',icon:'🌍',desc:'A broad mixture'},pub:{label:'Pub Quiz',icon:'🍺',desc:'Classic pub questions'}};const bank={logos:[['Which company uses this logo?',['Nike','Adidas','Puma','Reebok'],0,'https://logo.clearbit.com/nike.com'],['Which company uses this logo?',['Apple','Microsoft','Samsung','Sony'],0,'https://logo.clearbit.com/apple.com'],['Which company uses this logo?',['McDonald’s','Burger King','KFC','Subway'],0,'https://logo.clearbit.com/mcdonalds.com'],['Which company uses this logo?',['Netflix','Disney+','Prime Video','Hulu'],0,'https://logo.clearbit.com/netflix.com'],['Which company uses this logo?',['BMW','Audi','Mercedes-Benz','Ford'],0,'https://logo.clearbit.com/bmw.com'],['Which company uses this logo?',['Spotify','YouTube','TikTok','SoundCloud'],0,'https://logo.clearbit.com/spotify.com']],movies:[['Who played Jack in Titanic?',['Leonardo DiCaprio','Brad Pitt','Tom Cruise','Matt Damon'],0],['Which TV show is set in Hawkins?',['Stranger Things','Wednesday','Lost','Dark'],0],['What is Batman’s home city?',['Gotham City','Metropolis','Star City','Central City'],0],['Which film features a talking snowman called Olaf?',['Frozen','Moana','Tangled','Brave'],0],['Who is the main ogre in Shrek?',['Shrek','Donkey','Farquaad','Puss'],0],['Which series includes the Iron Throne?',['Game of Thrones','The Witcher','Vikings','The Crown'],0]],price:[['Closest price for a standard UK first-class stamp in 2026?',['£1.70','£0.85','£2.50','£3.20'],0],['Closest price for a new PlayStation 5 Slim Digital Edition?',['£430','£180','£700','£950'],0],['Closest price for a cinema ticket for one adult?',['£12','£3','£30','£55'],0],['Closest price for a basic takeaway pizza?',['£15','£4','£35','£60'],0],['Closest price for a litre of petrol?',['£1.45','£0.45','£3.50','£6.00'],0],['Closest price for a new mid-range smartphone?',['£500','£80','£1,800','£3,000'],0]],lines:[['“I’ll be back.”',['The Terminator','Rocky','Jaws','Alien'],0],['“Why so serious?”',['The Dark Knight','Joker','Batman Begins','The Batman'],0],['“You can’t handle the truth!”',['A Few Good Men','Top Gun','Heat','The Departed'],0],['“There’s no place like home.”',['The Wizard of Oz','Mary Poppins','Annie','Matilda'],0],['“To infinity and beyond!”',['Toy Story','Cars','Up','WALL-E'],0],['“I see dead people.”',['The Sixth Sense','Ghost','Poltergeist','The Others'],0]],disney:[['What is Simba’s father called?',['Mufasa','Scar','Timon','Rafiki'],0],['Which princess has a chameleon named Pascal?',['Rapunzel','Ariel','Belle','Jasmine'],0],['What kind of fish is Nemo?',['Clownfish','Goldfish','Tuna','Shark'],0],['Who leaves a glass slipper behind?',['Cinderella','Aurora','Snow White','Tiana'],0],['Which character says “Ohana means family”?',['Stitch','Mickey','Goofy','Simba'],0],['What is the name of Elsa’s sister?',['Anna','Moana','Merida','Mirabel'],0]],lyrics:[['Finish: “Twinkle, twinkle, little…”',['star','moon','light','sky'],0],['Finish: “We will, we will…”',['rock you','find you','love you','beat you'],0],['Finish: “Is this the real life? Is this…”',['just fantasy','a mystery','my destiny','a dream'],0],['Finish: “You are my sunshine, my only…”',['sunshine','darling','true love','bright light'],0],['Finish: “Don’t stop believing, hold on to…”',['that feeling','the night','your dreams','the music'],0],['Finish: “Hit me baby one more…”',['time','night','day','chance'],0]],general:[['What is the capital of Australia?',['Canberra','Sydney','Melbourne','Perth'],0],['How many sides does a hexagon have?',['6','5','7','8'],0],['Which planet is known as the Red Planet?',['Mars','Venus','Jupiter','Mercury'],0],['What is H2O commonly called?',['Water','Oxygen','Hydrogen','Salt'],0],['Which animal is the largest mammal?',['Blue whale','Elephant','Giraffe','Hippo'],0],['How many minutes are in two hours?',['120','90','100','140'],0]],pub:[['Which spirit is used in a mojito?',['Rum','Gin','Vodka','Whisky'],0],['What colour is the middle light on UK traffic lights?',['Amber','Green','Red','Blue'],0],['How many players start on a football team?',['11','10','12','9'],0],['Which country invented pizza?',['Italy','France','Spain','Greece'],0],['What is the smallest prime number?',['2','1','3','0'],0],['Which ocean lies between Europe and America?',['Atlantic','Pacific','Indian','Arctic'],0]]};let selected=new Set(['general']);function show(x){['setup','lobby','game','result'].forEach(v=>$(v).classList.toggle('hidden',v!==x))}function renderCategories(){$('categories').innerHTML=Object.entries(categories).map(([key,c])=>`<label class="category ${selected.has(key)?'selected':''}"><input type="checkbox" value="${key}" ${selected.has(key)?'checked':''}><span>${c.icon}</span><span><strong>${c.label}</strong><small>${c.desc}</small></span></label>`).join('');$('selectionNote').textContent=`${selected.size} of 6 selected`;document.querySelectorAll('.category input').forEach(input=>input.onchange=()=>{if(input.checked&&selected.size>=6){input.checked=false;$('status').textContent='You can choose up to 6 categories.';return}input.checked?selected.add(input.value):selected.delete(input.value);if(!selected.size){selected.add('general')}renderCategories()})}function makeQuestions(n,keys=[...selected]){let pool=[];keys.forEach(key=>(bank[key]||[]).forEach(q=>pool.push({q:q[0],answers:q[1],correct:q[2],image:q[3]||'',category:categories[key]?.label||key})));pool=shuffle(pool);while(pool.length<n){pool=pool.concat(shuffle(pool))}return pool.slice(0,n).map(item=>{const correctText=item.answers[item.correct],answers=shuffle(item.answers);return{...item,answers,correct:answers.indexOf(correctText)}})}async function api(url,opt){const r=await fetch(url,opt);return r.json()}async function readRoom(){return api(`${DB}/${room}.json`)}async function patch(path,data){return api(`${DB}/${room}/${path}.json`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)})}function renderScores(players={}){const html=Object.values(players).sort((a,b)=>(b.score||0)-(a.score||0)).map((p,i)=>`<div class="row"><span>${i+1}. ${p.name}</span><b>${p.score||0}</b></div>`).join('');$('players').innerHTML=html;$('scores').innerHTML=html}function renderTeamScores(target='scores'){const sorted=teamList.map((t,i)=>({...t,original:i})).sort((a,b)=>b.score-a.score);$(target).innerHTML=sorted.map((t,i)=>`<div class="row ${t.original===activeTeam&&target==='scores'?'active-team':''}"><span>${i+1}. ${t.name}</span><b>${t.score}</b></div>`).join('')}function render(){locked=false;$('next').classList.add('hidden');const item=qs[index];$('progress').textContent=`Question ${index+1} of ${qs.length}`;$('questionType').textContent=item.category;if(gameMode==='teams'){$('teamTurn').classList.remove('hidden');$('teamTurn').textContent=`${teamList[activeTeam].name}'s turn`;$('score').textContent=`Team score: ${teamList[activeTeam].score}`;renderTeamScores()}else{$('teamTurn').classList.add('hidden');$('score').textContent=`Score: ${score}`}$('question').textContent=item.q;$('quizImage').classList.toggle('hidden',!item.image);if(item.image)$('quizImage').src=item.image;$('answers').innerHTML='';item.answers.forEach((a,n)=>{const b=document.createElement('button');b.className='answer';b.textContent=a;b.onclick=()=>answer(n,b);$('answers').appendChild(b)})}async function answer(n,b){if(locked)return;locked=true;const right=qs[index].correct;[...$('answers').children].forEach((x,j)=>{x.disabled=true;if(j===right)x.classList.add('correct')});if(n===right){if(gameMode==='teams')teamList[activeTeam].score++;else score++}else b.classList.add('wrong');if(gameMode==='teams')renderTeamScores();else $('score').textContent=`Score: ${score}`;if(room)await patch(`players/${id}`,{score,answered:index});if(!room||host)$('next').classList.remove('hidden')}function validate(){if(!selected.size){$('status').textContent='Choose at least one category.';return false}return true}async function single(){if(!validate())return;gameMode='single';name=$('name').value.trim()||'Player';qs=makeQuestions(+$('count').value);index=score=0;show('game');render()}function buildTeamFields(){const count=+$('teamCount').value;$('teamFields').innerHTML=Array.from({length:count},(_,i)=>`<input class="team-input" maxlength="18" placeholder="Team ${i+1} name" value="Team ${i+1}">`).join('')}async function startTeams(){if(!validate())return;gameMode='teams';teamList=[...document.querySelectorAll('.team-input')].map((input,i)=>({name:input.value.trim()||`Team ${i+1}`,score:0}));activeTeam=index=0;qs=makeQuestions(+$('count').value);show('game');render()}async function create(){if(!validate())return;gameMode='multi';name=$('name').value.trim()||'Host';room=String(Math.floor(1000+Math.random()*9000));host=true;const cats=[...selected],count=+$('count').value;await api(`${DB}/${room}.json`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({hostId:id,phase:'lobby',count,categories:cats,index:0,players:{[id]:{name,score:0,answered:-1}}})});listen();show('lobby')}async function join(){gameMode='multi';name=$('name').value.trim()||'Player';room=$('code').value.trim();const r=await readRoom();if(!r){$('status').textContent='Room not found.';return}host=r.hostId===id;await patch(`players/${id}`,{name,score:0,answered:-1});listen();show('lobby')}function listen(){clearInterval(timer);$('room').textContent=room;timer=setInterval(async()=>{const r=await readRoom();if(!r)return;renderScores(r.players);$('startMulti').classList.toggle('hidden',!host);$('waiting').classList.toggle('hidden',host);if(r.phase==='playing'){qs=r.questions||[];const ni=r.index||0;score=r.players?.[id]?.score||0;if(index!==ni||$('game').classList.contains('hidden')){index=ni;show('game');render()}}if(r.phase==='finished'){show('result');$('final').innerHTML=Object.values(r.players||{}).sort((a,b)=>(b.score||0)-(a.score||0)).map((p,i)=>`<div class="row"><span>${i+1}. ${p.name}</span><b>${p.score||0}/${r.count}</b></div>`).join('')}},900)}async function startMulti(){const r=await readRoom(),q=makeQuestions(r.count||10,r.categories||['general']);await patch('',{phase:'playing',questions:q,index:0})}async function next(){if(gameMode==='teams'){index++;if(index<qs.length){activeTeam=(activeTeam+1)%teamList.length;render()}else{show('result');renderTeamScores('final')}return}if(!room){index++;if(index<qs.length)render();else{$('final').innerHTML=`<div class="row"><span>${name}</span><b>${score}/${qs.length}</b></div>`;show('result')}return}const ni=index+1;if(ni>=qs.length)await patch('',{phase:'finished'});else await patch('',{index:ni})}$('single').onclick=single;$('teams').onclick=()=>{$('teamBox').classList.toggle('hidden');$('joinBox').classList.add('hidden');buildTeamFields()};$('teamCount').onchange=buildTeamFields;$('startTeams').onclick=startTeams;$('create').onclick=create;$('showJoin').onclick=()=>{$('joinBox').classList.toggle('hidden');$('teamBox').classList.add('hidden')};$('join').onclick=join;$('startMulti').onclick=startMulti;$('next').onclick=next;renderCategories();buildTeamFields();</script></body></html>
